<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Usuários — Motor de Frete</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/painel/panel.css" />
</head>
<body>
  <main class="wide">
    <h1>Usuários</h1>
    <p class="lede"><strong>Admin</strong> gerencia credenciais dos Correios e outros usuários. <strong>Operador</strong> mexe em tabelas e regras, mas não em credenciais nem em contas.</p>

    <div class="card">
      <h2>Usuários cadastrados</h2>
      <div style="overflow-x:auto">
        <table class="data-table" id="users-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Papel</th>
              <th>Status</th>
              <th>Criado em</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="users-body">
            <tr><td colspan="6">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Novo usuário</h2>
      <form id="create-form">
        <label for="name">Nome</label>
        <input type="text" id="name" required />
        <label for="email">E-mail</label>
        <input type="email" id="email" required />
        <label for="password">Senha (mínimo 8 caracteres)</label>
        <input type="text" id="password" minlength="8" required autocomplete="new-password" />
        <label for="role">Papel</label>
        <select id="role">
          <option value="operador">Operador</option>
          <option value="admin">Admin</option>
        </select>
        <button class="primary" type="submit">Criar usuário</button>
        <div class="message" id="create-msg"></div>
      </form>
    </div>
  </main>

  <script type="module">
    import { authFetch, renderSidebar, requireAuth, showMessage, getUser } from "/painel/panel.js";

    requireAuth();
    renderSidebar("usuarios");

    const me = getUser();
    const usersBody = document.getElementById("users-body");

    async function loadUsers() {
      const res = await authFetch("/users");
      const users = await res.json();

      usersBody.innerHTML = users
        .map(
          (u) => `
        <tr>
          <td>${u.name}</td>
          <td>${u.email}</td>
          <td>
            <select data-role="${u.id}" ${u.id === me.id ? "disabled" : ""}>
              <option value="operador" ${u.role === "operador" ? "selected" : ""}>Operador</option>
              <option value="admin" ${u.role === "admin" ? "selected" : ""}>Admin</option>
            </select>
          </td>
          <td><span class="status ${u.active ? "ok" : "warn"}">${u.active ? "ativo" : "inativo"}</span></td>
          <td>${new Date(u.created_at).toLocaleDateString("pt-BR")}</td>
          <td class="actions">
            <button class="link-btn" data-toggle="${u.id}" data-active="${u.active}" ${u.id === me.id ? "disabled" : ""}>${u.active ? "desativar" : "ativar"}</button>
            <button class="link-btn" data-reset="${u.id}">redefinir senha</button>
          </td>
        </tr>`,
        )
        .join("");

      usersBody.querySelectorAll("[data-role]").forEach((select) => {
        select.addEventListener("change", () => updateUser(select.dataset.role, { role: select.value }));
      });
      usersBody.querySelectorAll("[data-toggle]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const active = btn.dataset.active === "true";
          updateUser(btn.dataset.toggle, { active: !active });
        });
      });
      usersBody.querySelectorAll("[data-reset]").forEach((btn) => {
        btn.addEventListener("click", () => resetPassword(btn.dataset.reset));
      });
    }

    async function updateUser(id, partial) {
      const row = usersBody.querySelector(`[data-role="${id}"]`);
      const currentRole = row.value;
      const activeBtn = usersBody.querySelector(`[data-toggle="${id}"]`);
      const currentActive = activeBtn.dataset.active === "true";

      const payload = { role: currentRole, active: currentActive, ...partial };

      const res = await authFetch(`/users/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Falha ao atualizar usuário.");
      }
      loadUsers();
    }

    async function resetPassword(id) {
      const password = prompt("Nova senha (mínimo 8 caracteres):");
      if (!password) return;

      const res = await authFetch(`/users/${id}/reset-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || "Falha ao redefinir senha.");
        return;
      }
      alert("Senha redefinida.");
    }

    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("create-msg");
      const btn = e.target.querySelector("button");
      btn.disabled = true;

      try {
        const res = await authFetch("/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            role: document.getElementById("role").value,
          }),
        });
        const data = await res.json();

        if (!res.ok) {
          showMessage(msg, data.error || "Falha ao criar usuário.", "bad");
          return;
        }

        showMessage(msg, `Usuário ${data.name} criado.`, "ok");
        e.target.reset();
        loadUsers();
      } finally {
        btn.disabled = false;
      }
    });

    loadUsers();
  </script>
</body>
</html>
