<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Tabelas — Motor de Frete</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/painel/panel.css" />
</head>
<body>
  <main>
    <h1>Tabelas de frete</h1>
    <p class="lede">Loggi e J&amp;T Express funcionam por zona: cada faixa de CEP cai numa praça (ex: "SP CAP"), e o preço depende da praça e do peso. Suba os arquivos originais da transportadora — a extração da zona, CEP e preço é automática.</p>

    <div class="card">
      <h2>Subir tabela</h2>
      <form id="upload-form">
        <label for="carrier">Transportadora</label>
        <select id="carrier" required>
          <option value="">Carregando…</option>
        </select>

        <div id="loggi-fields">
          <label for="loggi-file">Arquivo da Loggi (.xlsx — "price agreement", já traz preço e abrangência)</label>
          <input type="file" id="loggi-file" accept=".xlsx" />
        </div>

        <div id="jt-fields" style="display:none">
          <label for="jt-abrangencia">Arquivo de abrangência/prazos (.xlsx)</label>
          <input type="file" id="jt-abrangencia" accept=".xlsx" />
          <label for="jt-proposta">Arquivo de proposta comercial/preços (.xlsx)</label>
          <input type="file" id="jt-proposta" accept=".xlsx" />
        </div>

        <button class="primary" type="submit">Enviar e validar</button>
        <div class="message" id="upload-msg"></div>
        <div id="unmatched-box" style="display:none;margin-top:10px;font-size:12.5px;color:var(--warn)"></div>
      </form>
    </div>
  </main>

  <script type="module">
    import { authFetch, renderSidebar, requireAuth, showMessage } from "/painel/panel.js";

    requireAuth();
    renderSidebar("tabelas");

    const carrierSelect = document.getElementById("carrier");
    const loggiFields = document.getElementById("loggi-fields");
    const jtFields = document.getElementById("jt-fields");

    function toggleFields() {
      const isJt = carrierSelect.value === "jt-express";
      loggiFields.style.display = isJt ? "none" : "block";
      jtFields.style.display = isJt ? "block" : "none";
    }

    async function loadCarriers() {
      const res = await authFetch("/admin/carriers");
      const carriers = await res.json();
      carrierSelect.innerHTML = carriers
        .map((c) => `<option value="${c.code}">${c.name}</option>`)
        .join("");
      toggleFields();
    }

    carrierSelect.addEventListener("change", toggleFields);

    document.getElementById("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      const msg = document.getElementById("upload-msg");
      const unmatchedBox = document.getElementById("unmatched-box");
      unmatchedBox.style.display = "none";

      const code = carrierSelect.value;
      const formData = new FormData();

      if (code === "jt-express") {
        const abrangencia = document.getElementById("jt-abrangencia").files[0];
        const proposta = document.getElementById("jt-proposta").files[0];
        if (!abrangencia || !proposta) {
          showMessage(msg, "Selecione os dois arquivos da J&T.", "bad");
          return;
        }
        formData.append("abrangencia", abrangencia);
        formData.append("proposta", proposta);
      } else {
        const file = document.getElementById("loggi-file").files[0];
        if (!file) {
          showMessage(msg, "Selecione o arquivo da Loggi.", "bad");
          return;
        }
        formData.append("file", file);
      }

      btn.disabled = true;
      showMessage(msg, "Processando planilha (pode levar um pouco pra tabelas grandes)…", "ok");

      try {
        const res = await authFetch(`/admin/carriers/${code}/rate-table`, {
          method: "POST",
          body: formData,
        });
        const data = await res.json();

        if (!res.ok) {
          showMessage(msg, data.error || "Falha ao importar.", "bad");
          return;
        }

        showMessage(msg, data.message, "ok");
        if (data.unmatchedZones && data.unmatchedZones.length > 0) {
          unmatchedBox.style.display = "block";
          unmatchedBox.textContent = `Aviso: ${data.unmatchedZones.length} zona(s) de CEP não têm preço correspondente e serão ignoradas nessas regiões: ${data.unmatchedZones.slice(0, 15).join(", ")}${data.unmatchedZones.length > 15 ? "…" : ""}`;
        }
      } finally {
        btn.disabled = false;
      }
    });

    loadCarriers();
  </script>
</body>
</html>
